name: tretech_mobile
description: "Tretech Warehouse & Inventory Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ─────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── State Management ───────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.6.1

  # ── Local Storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # ── Data Models ────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── UI & Theming ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # ── QR & Barcode ───────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5

  # ── Bluetooth Thermal Printing ─────────────────────────────
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.3

  # ── PDF Generation ─────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2

  # ── Utilities ──────────────────────────────────────────────
  intl: ^0.20.1
  logger: ^2.4.0
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  equatable: ^2.0.7
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.5.3

  # ── Linting ────────────────────────────────────────────────
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
